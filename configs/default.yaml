# Default SeqFall configuration.
#
# As shipped this runs the scripted backend: no GPU, no downloads, about two
# seconds. It exists so you can see the whole pipeline work before you trust it
# with a real model. Scripted numbers are synthetic and must never go in a
# results table.
#
# To run a real model, comment out the scripted entry and uncomment the hf ones.

suite:
  n_per_cell: 15          # 15 x 4 regimes x 4 k values = 240 items; use 56 for the full 900
  ks: [2, 3, 4, 6]
  regimes: [independent, commutative_write, order_sensitive, dependent]
  seed: 20261012
  inject_faults: false    # flip to true for the A3 recovery experiment

harnesses:
  - h1_native
  - h2_parallel_forced
  - h3_serial_sanctioned
  - h4_serial_repeat

max_turns: 0              # 0 means len(reference_calls) + 2
per_call_latency: 0.25    # seconds charged per tool call in the latency model
alpha: 0.25               # GDS weight on turn inflation
beta: 0.25                # GDS weight on latency inflation

backend_defaults:
  temperature: 0.0
  max_new_tokens: 384

models:
  - tag: scripted-tiny
    backend: scripted
    profile: tiny
    seed: 11
  - tag: scripted-small
    backend: scripted
    profile: small
    seed: 12
  - tag: scripted-mid
    backend: scripted
    profile: mid
    seed: 13

